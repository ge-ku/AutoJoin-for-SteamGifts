<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="alternate stylesheet" href="../css/general.css" title="chromeOptions" />
    <link rel="stylesheet" href="../css/chromeOptions.css" title="chromeOptions" />

    <script type="text/javascript" src="../js/settings.js"></script>
    <script type="text/javascript" src="../js/chromeOptions.js"></script>

<body>
    <div id="bodyWrapper">
        <div id="settingsDiv">
            <ul id="titlesList">
                <li class="titleListItem">General Settings</li>
                <ul>
                    <li>
                        <label>
                            <input id="chkInfiniteScroll" type="checkbox" />Enable Infinite Scrolling
                        </label>
                    </li>
                    <li>
                        <label>
                            <input id="chkShowPoints" type="checkbox" />Show points and level in top-left corner if
                            scrolled down
                        </label>
                    </li>
                    <li>
                        <label>
                            <input id="chkShowButtons" type="checkbox" />Show buttons to join/leave and warnings besides
                            each giveaway
                        </label>
                    </li>
                    <li>
                        <label>
                            <input id="chkAutoDescription" type="checkbox" />Automatically load descriptions of joined
                            giveaways
                        </label>
                    </li>
                    <li>
                        <label>
                            <input id="chkAutoComment" type="checkbox" />Automatically post following comment on joined
                            giveaways: <input id="txtAutoComment" type="text"
                                placeholder="Separate different comments to choose from with #" />
                        </label>
                    </li>
                    <li>
                        <label>
                            <input id="chkShowChance" type="checkbox" />Show approximate odds of winning
                        </label>
                    </li>
                    <li>
                        <label>
                            <input id="chkPreciseTime" type="checkbox" />Show precise remaining time of each giveaway
                        </label>
                    </li>
                    <li>
                        <label>
                            <input id="chkNightTheme" type="checkbox" />Enable Night theme
                        </label>
                    </li>
                    <li>
                        <strong>Filter giveaways shown by:</strong>
                    </li>
                    <li>
                        <label>
                            <input id="chkHideDlc" type="checkbox" />Hide DLC giveaways
                        </label> &nbsp;&nbsp;
                        <label>
                            <input id="chkHideNonTradingCards" type="checkbox" />Hide non trading card giveaways
                        </label> &nbsp;&nbsp;
                        <label>
                            <input id="chkHideGroups" type="checkbox" />Hide steam group giveaways
                        </label> &nbsp;&nbsp;
                        <label>
                            <input id="chkHideWhitelist" type="checkbox" />Hide steamgifts whitelist giveaways
                        </label> &nbsp;&nbsp;
                        <label>
                            <input id="chkHideEntered" type="checkbox" />Hide joined giveaways
                        </label> &nbsp;&nbsp;
                        <label>
                            Hide giveaways below level <input id="hideLevelsBelow" type="number" min="0" max="10"
                                value="0" />
                        </label> &nbsp;&nbsp;
                        <label>
                            Hide giveaways with cost below <input id="hideCostsBelow" type="number" min="0" max="50"
                                value="0" />
                        </label>
                        <label>
                            Hide giveaways above level <input id="hideLevelsAbove" type="number" min="0" max="10"
                                value="10" />
                        </label> &nbsp;&nbsp;
                        <label>
                            Hide giveaways with cost above <input id="hideCostsAbove" type="number" min="0" max="50"
                                value="50" />
                        </label>
                    </li>
                </ul>
